# .github/workflows/zip-repo.yml
name: Archive Repository as ZIP

on:
  push:
    branches:
      - '2.0'
  workflow_dispatch:

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 📦 Create ZIP archive
        run: |
          zip -r repo-archive-${{ github.run_number }}.zip . -x '*.git*'

      - name: ☁️ Upload ZIP as artifact
        uses: actions/upload-artifact@v3
        with:
          name: repo-archive
          path: repo-archive-${{ github.run_number }}.zip
